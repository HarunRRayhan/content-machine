name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json's framework requirement is php ^8.3, but pestphp/pest ^5.1
        # (require-dev only) needs php ^8.4, so 8.4 is the floor the test suite can
        # actually run on today. Add 8.3 back if/when Pest supports it, or if this
        # matrix should instead track a runtime-only smoke test separate from Pest.
        php: ['8.4']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, intl, zip, bcmath, gd
          coverage: pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Configure database environment
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=password" >> .env

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests
        # The suite uses one PostgreSQL schema and RefreshDatabase transactions;
        # parallel workers race migrations and cannot safely share that schema.
        run: ./vendor/bin/pest

  static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # resources/js/{routes,actions} are generated from the route table by the
      # Wayfinder Vite plugin (php artisan wayfinder:generate under the hood) and
      # are gitignored. ESLint's import/order rule and tsc both need them on disk
      # to resolve `@/routes` and `@/actions` imports correctly, so generate them
      # before linting/type-checking rather than only at the end via `npm run build`.
      - name: Generate Wayfinder routes/actions
        # --with-form must match vite.config.ts's wayfinder({ formVariants: true }),
        # or the generated actions lack the .form() variant and tsc fails.
        run: php artisan wayfinder:generate --with-form

      - name: Lint (ESLint)
        run: npm run lint:check

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -f deploy/Dockerfile -t cm:ci .

      - name: Smoke test
        run: |
          # A bare `php artisan about` needs a real APP_KEY and .env to not
          # error; give it the throwaway env the assets build stage also uses.
          docker run --rm cm:ci sh -c "cp .env.example .env && php artisan key:generate --force && php artisan about --only=environment"
          docker run --rm cm:ci yt-dlp --version
          docker run --rm cm:ci ffmpeg -version

      - name: Smoke test web queue service
        run: |
          docker run --detach --rm --name cm-s6 \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env APP_ENV=production \
            --env AUTORUN_ENABLED=false \
            --env CM_MIGRATION_GATE=false \
            --env CM_SYNC_PRESENTATION_LIBRARY=false \
            --env QUEUE_CONNECTION=database \
            --env DB_CONNECTION=pgsql \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=1 \
            --env DB_DATABASE=unused \
            --env DB_USERNAME=unused \
            --env DB_PASSWORD=unused \
            --env CACHE_STORE=array \
            --env SESSION_DRIVER=array \
            cm:ci /init
          trap 'docker rm -f cm-s6' EXIT

          for attempt in $(seq 1 30); do
            if docker exec cm-s6 /command/s6-svstat /run/service/scratchpad-queue 2>/dev/null | grep -q '^up' \
              && docker exec cm-s6 /command/s6-svstat /run/service/postsyncer-queue 2>/dev/null | grep -q '^up'; then
              break
            fi
            sleep 1
          done

          docker exec cm-s6 /command/s6-svstat /run/service/scratchpad-queue | grep -q '^up'
          docker exec cm-s6 /command/s6-svstat /run/service/postsyncer-queue | grep -q '^up'
