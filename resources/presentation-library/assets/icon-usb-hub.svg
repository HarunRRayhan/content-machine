<!-- usb-hub: one upstream cable into a housing with three mouths, three devices hanging off it.
     Deliberately the "one in, many out" silhouette, where icon-usb-c is the single-connector
     reading of the same family (same cable + strain relief + oval mouth vocabulary, so the two
     sit together in a deck). Eleven shapes: meant to be drawn large (10cqh+); at UI-glyph size
     the three device blocks below start to merge, use icon-usb-c there instead. -->
