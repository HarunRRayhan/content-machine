<!-- home: a pitched-roof house with a chimney, for domestic analogies (a home network, home vs
     office vs cafe). Deliberately distinct from its three neighbours at 20px: icon-shop is a
     storefront with a striped awning, icon-warehouse a wide shed whose roof overhangs both walls,
     icon-bank a pediment on columns. The chimney is what does the work here, since a bare
     roof-over-walls silhouette is nearly the same shape as the warehouse. Its two verticals stop
     exactly on the right roof slope, so it reads as sitting in the roof rather than floating. -->
