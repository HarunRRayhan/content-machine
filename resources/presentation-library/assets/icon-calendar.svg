<!-- calendar: month grid with two hanging rings. The day dots are pl-fill so they stay solid
     against a consumer's stroke rules; five of them (not a full grid) keeps it legible small. -->
<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/><circle class="pl-fill" cx="8.5" cy="13.5" r="1.1"/><circle class="pl-fill" cx="12" cy="13.5" r="1.1"/><circle class="pl-fill" cx="15.5" cy="13.5" r="1.1"/><circle class="pl-fill" cx="8.5" cy="17" r="1.1"/><circle class="pl-fill" cx="12" cy="17" r="1.1"/></svg>
