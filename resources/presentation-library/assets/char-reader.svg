<!-- stick-figure human READING: standing planted (not mid-stride, unlike char-human), neck bent
     so the head hangs forward past the shoulders and out over what the hands hold, elbows tucked
     down by the torso with the forearms angled back up -- i.e. a book held at chest height and
     looked down into, not held out at arm's length. That posture, not any prop, is what makes it
     read as reading at phone scale, and the two forearms are deliberately kept ~7 units apart so
     they don't merge into one wedge when stroked thick. Same stroke language as
     char-human/char-robot (even weight, round caps, solid head via .pl-fill) and the same 64x76
     viewBox, so the figures are interchangeable in a layout.
     The book is deliberately NOT baked in, so a consumer can colour/animate/strike it on its
     own. The pairing contract, in viewBox units: the near hand ends at (44,39) and the far hand
     at (49,32), so an open book whose left edge sits at x~45 and whose page area covers y~25-62
     lands in the hands, just under the bowed head. Draw the book AFTER the figure and give its
     pages an opaque fill: the far arm then passes behind it, which is what makes the pair read
     as "holding and reading" rather than "person beside a book". -->
<svg viewBox="0 0 64 76" aria-hidden="true"><circle class="pl-fill" cx="36" cy="16" r="8.5"/><path d="M25 26 L32 19"/><path d="M25 26 L22 49"/><path d="M25 28 L32 37 L49 32"/><path d="M24 31 L29 44 L44 39"/><path d="M22 49 L18 61 L17 73"/><path d="M22 49 L27 61 L28 73"/></svg>
