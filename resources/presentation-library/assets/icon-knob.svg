<!-- knob / dial: a control ring with a pointer, plus two range ticks radiating from it.
     A static glyph, for label-scale use ("setting", "tuning", "a control"). A deck that
     needs a knob whose pointer actually moves should draw its own rotating element (the
     ticks must stay put while the pointer turns) and use this only at label scale. -->
