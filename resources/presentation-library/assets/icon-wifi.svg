<!-- wifi: three broadcast arcs over a solid source dot. Drawn as arcs rather than a filled fan so
     it keeps the icon set's even stroke weight, and the dot is pl-fill because a hollow ring at the
     origin reads as a fourth arc. The counterpart to icon-plug (a wired connection) and
     icon-globe (the whole internet); this one is specifically "a local wireless network". -->
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 8.6C5 6.3 8.4 5 12 5s7 1.3 9.6 3.6"/><path d="M5.4 12.2C7.2 10.6 9.5 9.7 12 9.7s4.8.9 6.6 2.5"/><path d="M8.5 15.7c1-.9 2.2-1.4 3.5-1.4s2.5.5 3.5 1.4"/><circle class="pl-fill" cx="12" cy="19.4" r="1.5"/></svg>
