<!-- crowd: three head-and-shoulder figures, the middle one forward. Reads as "many people /
     incoming traffic" at 20px, where char-human (a single full stick figure) would read as one
     person. Heads are outlines rather than .pl-fill so the glyph keeps the icon set's even
     stroke weight when it sits next to icon-server / icon-monitor in a row. -->
