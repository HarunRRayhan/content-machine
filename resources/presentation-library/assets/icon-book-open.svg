<!-- book, OPEN: two pages spreading from a centre spine, each with a page-block/cover band
     under it so the volume reads as thick (the same "this is a bound stack, not a sheet"
     trick icon-book uses on its closed cover). Sibling to icon-book, not a replacement:
     closed = a book you own, open = a book being read right now.
     Both page shapes are closed paths, so a consumer can fill them opaque (fill on the paths,
     stroke stays currentColor) and let a figure's arm pass behind the book. The two short
     rules per page read as text at phone scale and add nothing when filled. -->
