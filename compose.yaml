# Development stack: docker compose up --build. For deployment use compose.prod.yaml.
# Separate project name so dev commands can never touch production volumes.
name: content-machine-dev

x-dev: &dev
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: dev
  image: content-machine:dev
  volumes:
    - .:/app
    # Keep Linux-built dependencies off the host checkout.
    - vendor:/app/vendor
    - node_modules:/app/node_modules
  environment: &dev-env
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: content_machine
    DB_USERNAME: content_machine
    DB_PASSWORD: content_machine

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: content_machine
      POSTGRES_USER: content_machine
      POSTGRES_PASSWORD: content_machine
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: Postgres's first-boot init server answers only on the Unix socket.
      test: pg_isready -h 127.0.0.1 -U content_machine -d content_machine
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: installs dependencies, creates .env and the app key, migrates, builds assets.
  setup:
    <<: *dev
    command: composer run setup
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *dev
    # --no-reload keeps the DB_* values above; the reloading server drops them.
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully

  vite:
    <<: *dev
    command: npx vite
    environment:
      <<: *dev-env
      # Makes the Laravel Vite plugin listen on all interfaces but advertise localhost.
      LARAVEL_SAIL: "1"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      setup:
        condition: service_completed_successfully

  workers:
    <<: *dev
    command: >-
      npx concurrently --names queue,publish,schedule
      "php artisan queue:listen --queue=default,scratchpad --tries=1 --timeout=900"
      "php artisan queue:listen postsyncer --queue=postsyncer --tries=1 --timeout=900"
      "php artisan schedule:work"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  db:
  vendor:
  node_modules:
