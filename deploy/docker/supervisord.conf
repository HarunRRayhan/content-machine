; Runs the worker service's two long-lived processes. Not used by the web
; service (which runs the base image's own /init instead). Started via
; `docker-php-serversideup-entrypoint supervisord -c <this file>` — see
; deploy/railway.worker.json.

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:queue]
command=php /var/www/html/artisan queue:work --queue=default --tries=3 --backoff=10,60,300 --max-time=3600 --sleep=1 --rest=0.5
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
